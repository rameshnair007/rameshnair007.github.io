title: Ramesh Nair
description: > # this means to ignore newlines until "baseurl:"
  Senior Applied Machine Learning Engineer with expertise in Computer Vision, Deep Learning, and Object Detection & Tracking.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://rameshnair007.github.io" # the base hostname & protocol for your site, e.g. http://example.com
github_username:  rameshnair007
linkedin_username: rameshsnair

# Navigation
nav:
  - title: Home
    url: /
  - title: About
    url: /about/
  - title: Projects
    url: /projects/
  - title: Research
    url: /research/
  - title: Publications
    url: /publications/
  - title: Contact
    url: /contact/

# Theme settings
theme: minima
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Default share image for social previews (used by jekyll-seo-tag)
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/profile.jpg

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
